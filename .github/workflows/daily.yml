name: 집 알림 (매일)

on:
  schedule:
    - cron: "0 0 * * *"     # 매일 오전 9시 (한국시간) = 00:00 UTC
  workflow_dispatch:         # Actions 화면에서 "Run workflow" 버튼으로 바로 실행
    inputs:
      silent:
        description: "텔레그램 알림을 소리 없이 보내기 (밤에 수동 실행할 때)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: house-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 수집 + 텔레그램 알림
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SILENT_FLAG: ${{ inputs.silent && '--silent' || '' }}
        run: python house_alert.py $SILENT_FLAG

      - name: 결과 저장 (웹사이트 갱신)
        run: |
          git config user.name "house-alert-bot"
          git config user.email "house-alert-bot@users.noreply.github.com"
          git add docs/data.json data/seen.json
          git diff --cached --quiet || git commit -m "데이터 갱신 $(date +'%Y-%m-%d')"
          git pull --rebase -X theirs origin main || git pull --rebase origin main
          git push
