# =====================================================================
#  집 알림 설정 파일
#  이 파일만 고치면 조건이 바뀝니다. (# 뒤는 설명이라 무시돼요)
#  금액 단위는 모두 "만원" 입니다.  예) 3억 = 30000, 5천만원 = 5000
# =====================================================================

# ---- 관심 지역 ----------------------------------------------------
# code = 구 코드(바꾸지 마세요), dongs = 그 구에서 볼 동 이름(앞부분 일치)
[[regions]]
name  = "서울대입구·낙성대 (관악구)"
code  = "11620"
dongs = ["봉천동", "남현동"]

[[regions]]
name  = "사당 (동작구)"
code  = "11590"
dongs = ["사당동"]

[[regions]]
name  = "사당 남측 (서초구 방배동)"
code  = "11650"
dongs = ["방배동"]

[[regions]]
name  = "당산 (영등포구)"
code  = "11560"
dongs = ["당산동"]

# ---- 공통 조건 ----------------------------------------------------
[common]
min_area_m2 = 26.4      # 최소 전용면적(㎡). 8평 = 약 26.4㎡
min_floor   = 2         # 이 층 이상만 (1층·반지하 제외 → 2)
months_back = 3         # 최근 몇 개월 거래를 볼지 (신고가 최대 30일 늦어서 3 추천)
# 볼 주택 종류: "아파트", "오피스텔", "빌라"  (빌라 = 연립·다세대)
house_types = ["아파트", "오피스텔", "빌라"]

# ---- 매매 (최우선) -------------------------------------------------
[sale]
enabled   = true
min_price = 30000       # 3억
max_price = 50000       # 5억

# ---- 전세 --------------------------------------------------------
[jeonse]
enabled     = true
max_deposit = 20000     # 2억

# ---- 월세 --------------------------------------------------------
[wolse]
enabled     = true
max_deposit = 5000      # 보증금 5천
max_rent    = 70        # 월세 70

# ---- LH / SH 공고 -------------------------------------------------
[notices]
lh_enabled = true
sh_enabled = true
# 제목에 이 단어 중 하나가 있으면 알림 (모집 공고 위주)
include_keywords = ["모집", "공급", "입주자", "청약"]
# 제목에 이 단어가 있으면 알림 제외 (발표·결과 안내 등)
# ('예비입주자 모집'은 실제 모집이라 '예비'는 넣지 않아요. '예비자 발표'는 '발표'로 걸러져요)
exclude_keywords = ["당첨자", "발표", "결과", "서류제출", "계약안내", "정정공고", "취소공고", "채용", "합격자"]

# ---- 청년임대 --------------------------------------------------------
[youth]
soco_enabled = true          # 서울시 청년안심주택 모집공고 (서울주거포털)
soco_pages = 2               # 최근 공고 몇 페이지(10건씩)를 볼지
# 관심 구: 관악 05, 동작 12, 서초 15, 영등포 20, 용산 21  → 텔레그램에서 ⭐ 표시·맨 위
soco_fav_gu_codes = ["05", "12", "15", "20", "21"]

# ---- 공매 (온비드) ------------------------------------------------------
# 공공데이터포털에서 '한국자산관리공사_차세대 온비드 부동산 물건목록 조회서비스'
# 활용신청이 되어 있어야 작동해요 (같은 인증키 사용).
[auction]
enabled = true
gus = ["관악구", "동작구", "서초구", "영등포구"]
max_price = 60000            # 최저입찰가 상한 (만원) — 6억
include_share = false        # 지분 물건(일부 지분만 파는 것) 포함 여부

# ---- 텔레그램 --------------------------------------------------------
[telegram]
enabled = true
max_items_per_section = 15   # 한 번에 보낼 최대 건수 (나머지는 웹사이트에서)
